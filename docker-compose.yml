version: '3.8'

services:
  workwayz-web:
    image: ${WORKWAYZ_IMAGE:-workwayz/workwayz:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workwayz-web
    ports:
      - "3000:3000"
    volumes:
      - workwayz-data:/app/data
    environment:
      - NODE_ENV=production
      - WORKWAYZ_DATA_DIR=/app/data
    restart: always

volumes:
  workwayz-data:

