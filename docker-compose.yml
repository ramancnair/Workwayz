services:
  projectflow-web:
    image: ${PROJECTFLOW_IMAGE:-aswin/projectflow}:${PROJECTFLOW_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectflow-web
    ports:
      - "3000:3000"
    volumes:
      - projectflow-data:/app/data
    environment:
      - NODE_ENV=production
    restart: always

volumes:
  projectflow-data:

