name: Publish Release Artifacts

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to upload release assets
      packages: write   # Needed to push Docker images to GitHub Container Registry (ghcr.io)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # --- 1. Node.js Setup & Dependencies ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize package version to git tag
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # --- 2. Package Standalone Bundle & NPM Tarball ---
      - name: Package Standalone npm Bundle
        run: |
          mkdir -p dist
          # Copy Next.js standalone server output, static files, and public assets
          cp -r .next/standalone/* dist/
          mkdir -p dist/.next/static
          cp -r .next/static dist/.next/
          cp -r public dist/
          cp docker-entrypoint.sh dist/ 2>/dev/null || true
          # Include minimal package.json so "npm start" works inside the standalone folder
          node -e '
            const pkg = require("./package.json");
            const standalonePkg = {
              name: pkg.name + "-standalone",
              version: pkg.version,
              private: true,
              scripts: { start: "node server.js" }
            };
            require("fs").writeFileSync("dist/package.json", JSON.stringify(standalonePkg, null, 2));
          '
          tar -czf projectflow-standalone-v${{ github.ref_name }}.tar.gz -C dist .

      - name: Create npm package tarball
        run: |
          npm pack
          mv projectflow-*.tgz projectflow-npm-v${{ github.ref_name }}.tgz

      # --- 3. Docker Build & Push to GitHub Container Registry (ghcr.io) ---
      - name: Set lowercased image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Export offline Docker image tarball
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: projectflow-web:latest
          outputs: type=docker,dest=/tmp/projectflow-web-image.tar

      - name: Compress offline Docker image
        run: |
          gzip -9 /tmp/projectflow-web-image.tar
          mv /tmp/projectflow-web-image.tar.gz ./projectflow-web-image-v${{ github.ref_name }}.tar.gz

      # --- 4. Upload All Artifacts to GitHub Release ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projectflow-standalone-v${{ github.ref_name }}.tar.gz
            projectflow-npm-v${{ github.ref_name }}.tgz
            projectflow-web-image-v${{ github.ref_name }}.tar.gz
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
