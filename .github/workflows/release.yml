name: Publish Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v0.1.0 or Workwayz-v1.0.1)'
        required: false
        default: ''

jobs:
  build_and_publish:
    name: Build, Test & Publish (NPM + Docker Hub + GitHub Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to upload release assets
      packages: write   # Needed to push Docker images to GitHub Container Registry (ghcr.io)
      id-token: write   # Needed for provenance if configured

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # --- 1. Node.js Setup & Dependencies ---
      - name: Set up Node.js for Build & NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies cleanly
        run: npm ci

      # --- 2. Automated Quality Gate ---
      - name: Run Test Suite
        run: npm test

      # --- 3. Synchronize Version to Git Tag ---
      - name: Synchronize package version to git tag
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          CLEAN_VERSION=$(node -e '
            const fs = require("fs");
            const raw = process.argv[1] || "";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const match = raw.match(/(?:^|[^\d])(\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)/);
            let v = match ? match[1] : null;
            if (!v) {
              try {
                const semver = require("semver");
                const c = semver.coerce(raw);
                if (c) v = c.version;
              } catch (e) {}
            }
            if (!v) v = pkg.version;
            console.log(v);
          ' "$RAW_TAG")

          echo "Synchronizing package version to $CLEAN_VERSION (extracted from tag: $RAW_TAG)..."
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version
          echo "RELEASE_TAG=v${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "RAW_RELEASE_TAG=${RAW_TAG}" >> $GITHUB_ENV

      # --- 4. Build Next.js Application ---
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # --- 5. Publish to NPM Registry ---
      - name: Verify NPM Credentials
        run: |
          echo "Verifying npm authentication..."
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM Registry
        run: |
          if npm view "workwayz@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PACKAGE_VERSION} is already published on npm registry. Skipping duplicate publish."
          else
            npm publish --access public --verbose
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- 6. Package Standalone Bundle for Self-Hosters ---
      - name: Package Standalone npm Bundle
        run: |
          mkdir -p dist
          # Copy Next.js standalone server output (node_modules, server.js, package.json)
          cp -r .next/standalone/* dist/
          # Explicitly copy .next from standalone (contains server chunks, BUILD_ID, and required server manifests)
          cp -r .next/standalone/.next dist/
          # Standalone mode requires static assets and public directory to be copied manually
          mkdir -p dist/.next/static
          cp -r .next/static/. dist/.next/static/
          cp -r public dist/
          cp docker-entrypoint.sh dist/ 2>/dev/null || true
          # Remove any transient credentials or environment files
          rm -f dist/.env* dist/connections.json
          # Include minimal package.json so "npm start" works inside the standalone folder
          node -e '
            const pkg = require("./package.json");
            const standalonePkg = {
              name: pkg.name + "-standalone",
              version: pkg.version,
              private: true,
              scripts: { start: "node server.js" }
            };
            require("fs").writeFileSync("dist/package.json", JSON.stringify(standalonePkg, null, 2));
          '
          tar -czf workwayz-standalone-${{ env.RELEASE_TAG }}.tar.gz -C dist .

      # --- 7. Docker Build & Push to Docker Hub and GHCR ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/workwayz
            ghcr.io/${{ github.repository_owner }}/workwayz
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PACKAGE_VERSION }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub Description & Overview
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/workwayz
          short-description: "Workwayz - All-in-One AI-Powered Project & Portfolio Management Platform"
          readme-filepath: ./README.md

      # --- 8. Upload Release Assets to GitHub Release ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            workwayz-standalone-${{ env.RELEASE_TAG }}.tar.gz
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
