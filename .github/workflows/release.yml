name: Publish Release Artifacts

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to upload release assets
      packages: write   # Needed to push Docker images to GitHub Container Registry (ghcr.io)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # --- 1. Node.js Setup & Dependencies ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize package version to git tag
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version
          echo "RELEASE_TAG=v${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # --- 2. Package Standalone Bundle & NPM Tarball ---
      - name: Package Standalone npm Bundle
        run: |
          mkdir -p dist
          # Copy Next.js standalone server output (node_modules, server.js, package.json)
          cp -r .next/standalone/* dist/
          # Explicitly copy .next from standalone (contains server chunks, BUILD_ID, and required server manifests)
          cp -r .next/standalone/.next dist/
          # Standalone mode requires static assets and public directory to be copied manually
          mkdir -p dist/.next/static
          cp -r .next/static/. dist/.next/static/
          cp -r public dist/
          cp docker-entrypoint.sh dist/ 2>/dev/null || true
          # Remove any transient credentials or environment files
          rm -f dist/.env* dist/connections.json
          # Include minimal package.json so "npm start" works inside the standalone folder
          node -e '
            const pkg = require("./package.json");
            const standalonePkg = {
              name: pkg.name + "-standalone",
              version: pkg.version,
              private: true,
              scripts: { start: "node server.js" }
            };
            require("fs").writeFileSync("dist/package.json", JSON.stringify(standalonePkg, null, 2));
          '
          tar -czf projectflow-standalone-${{ env.RELEASE_TAG }}.tar.gz -C dist .

      - name: Create npm package tarball
        run: |
          npm pack
          mv projectflow-*.tgz projectflow-npm-${{ env.RELEASE_TAG }}.tgz

      # --- 3. Docker Build & Push to GitHub Container Registry (ghcr.io) ---
      - name: Set lowercased image name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Single Build for GHCR & Offline Export)
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }} \
            -t projectflow-web:latest \
            .

      - name: Push Docker Image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}

      - name: Export and Compress Offline Docker Image
        run: |
          docker save projectflow-web:latest | gzip -9 > ./projectflow-web-image-${{ env.RELEASE_TAG }}.tar.gz

      # --- 4. Upload All Artifacts to GitHub Release ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projectflow-standalone-${{ env.RELEASE_TAG }}.tar.gz
            projectflow-npm-${{ env.RELEASE_TAG }}.tgz
            projectflow-web-image-${{ env.RELEASE_TAG }}.tar.gz
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
