name: Publish Release Artifacts

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  release:
    types: [published]

jobs:
  build_and_upload:
    name: Build and Upload Artifacts to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to upload release assets
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Inject Release Version
        run: |
          VERSION_TAG=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION_TAG#v}
          CLEAN_VERSION=${CLEAN_VERSION#release-}
          jq --arg v "$CLEAN_VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            aswin/projectflow:latest
            aswin/projectflow:${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build Standalone App
        env:
          NEXT_PUBLIC_DB_PROVIDER: supabase
          NEXT_PUBLIC_DATABASE_PROVIDER: supabase
          NEXT_PUBLIC_AUTH_PROVIDER: supabase
        run: |
          npm ci
          npm run build
          mkdir -p ./release-standalone/projectflow
          # Copy standalone output (including hidden directories like .next)
          cp -a .next/standalone/. ./release-standalone/projectflow/
          # Copy static files (standalone needs this)
          mkdir -p ./release-standalone/projectflow/.next
          cp -r .next/static ./release-standalone/projectflow/.next/
          cp -r public ./release-standalone/projectflow/
          # Copy scripts
          cp -r scripts ./release-standalone/projectflow/
          cp package.json ./release-standalone/projectflow/

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd ./release-standalone/projectflow
          npm publish --access public

      - name: Zip Standalone App (Fallback)
        run: |
          cd ./release-standalone
          zip -r ../projectflow-standalone-v${{ github.ref_name }}.zip projectflow/
          cd ..
          zip projectflow-docker-setup-v${{ github.ref_name }}.zip docker-compose.yml .env.local.example || zip projectflow-docker-setup-v${{ github.ref_name }}.zip docker-compose.yml

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projectflow-standalone-v${{ github.ref_name }}.zip
            projectflow-docker-setup-v${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

