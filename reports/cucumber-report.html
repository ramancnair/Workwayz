navigates to \"My Projects\"\n    Then the workspace should display all active projects where Sarah Connor is staffed\n    And a distinct \"Initial Estimations\" section should be visible listing projects pending engineering validation\n    And clicking an item in the Initial Estimations list should navigate to that project's Initial Estimation workspace\n\n  Scenario: Create New Project under Parent Portfolio\n    Given the PM is on the \"Projects Home\" page\n    When the PM clicks \"Create New Project\"\n    And the user selects Parent Portfolio \"Digital Transformation Portfolio\"\n    And the user enters Project Name \"E-Commerce Mobile Portal\"\n    And sets Start Date \"2026-08-01\" and End Date \"2027-02-01\"\n    And assigns Project Manager \"Sarah Connor\"\n    And selects Pricing Model \"Time & Material\"\n    And sets initial status to \"Initial Estimation\"\n    And clicks \"Save Project\"\n    Then the new project \"E-Commerce Mobile Portal\" should be created under \"Digital Transformation Portfolio\"\n\n  Scenario: Unassigned Portfolio Fallback\n    Given a user creates a project without choosing a specific portfolio\n    When the project is saved\n    Then the system should automatically map the project underneath \"Unassigned Portfolio\"\n\n  Scenario: Executive Portfolio Health Dashboard Filtering\n    Given the Senior Manager accesses the \"Portfolio Dashboard\"\n    Then only active initiatives with health state designated as \"Red\" or \"Yellow\" should be aggregated\n    And the dashboard layout should display:\n      | Quadrant Section                |\n      | High Potential Risks            |\n      | Critical & High Priority Issues |\n      | Red Health Projects             |\n\n  Scenario: Audit Quality and Estimations Variance\n    Given a Delivery Manager views the \"Quality & Estimations\" auditing panel\n    Then the panel should display the three structural gates:\n      | Gate                 | Description                          |\n      | Initial Estimation   | High-level requirement phase         |\n      | Planned Estimation   | Post-user story & sub-task breakout  |\n      | Actual Effort        | Tallied from worklog entries         |\n    And the KPI summary card should highlight:\n      | Metric                     | Value         |\n      | Active Portfolio Projects  | 12            |\n      | Ballpark Estimations       | 450 Man-Days  |\n      | Planned Effort             | 480 Man-Days  |\n      | Actual Effort Consumed     | 310 Man-Days  |\n      | Variance Percentage        | -5.2%         |\n\n  Scenario: Defects Containment and Leakage Rate Monitoring\n    Given the QA Director opens the \"Defects Dashboard\"\n    Then the defect metrics should be categorized into:\n      | Defect Phase        |\n      | SIT Phase Defects   |\n      | UAT Phase Defects   |\n      | Production Leaks    |\n    And the system should automatically calculate and display the macro \"Average Leakage Rate %\"\n\n  Scenario: Overview Financial Ledger in Billing Dashboard\n    Given the Financial Auditor views the \"Billing Dashboard\"\n    Then the top-line summary should display Total Revenue, Resource Cost, Fixed Cost, Net Profit, and Realized/Collected Payments\n    And the project ledger should display a zebra-striped breakdown distinguishing between \"Time & Material\" and \"Fixed Bid\" models\n\n  Scenario: User Enablement Approval and Direct Ingestion\n    Given an Administrator navigates to \"Users & User List\"\n    Then the \"Users Awaiting Enablement\" queue should list pending self-registered users\n    When the Admin approves user \"Alice Smith\"\n    Then \"Alice Smith\" should be granted system access permissions\n    When the Admin clicks \"Add New User\" and inputs:\n      | Field            | Value              |\n      | First Name       | David              |\n      | Last Name        | Miller             |\n      | Employee ID      | EMP-205            |\n      | Phone            | +15550198765       |\n      | Experience       | 8                  |\n      | Access Level     | Project Manager    |\n      | Password         | TempP@ss2026!      |\n      | Resource Cost    | 65 USD/hour        |\n    And submits the modal\n    Then the new user \"David Miller\" should be provisioned directly into the resource pool\n\n  Scenario: Resource Utilization Saturation Monitoring\n    Given a Resource Manager opens \"Resource Utilization\"\n    When searching for employee \"John Doe\" (EMP-101)\n    Then the Availability Outlook card should show operational capacity saturation\n    And if capacity exceeds 100% (e.g. \"Utilization at 248%\"), it should highlight an excessive multi-project staffing alert\n    And the monthly color-coded Availability Grid should update day-by-day availability\n\n  Scenario: AI Auto-fill Holiday Calendar\n    Given an Administrator is on \"Holidays & Holiday Calendar\"\n    When the user configures Weekly Off-Days as \"Saturday\" and \"Sunday\"\n    And clicks \"Auto-fill with AI\" for region \"United States - 2026\"\n    Then the yearly holidays grid should automatically populate official domestic holidays\n\n  Scenario: Leave Tracker Policy Constraints and Conflict Prevention\n    Given a team member \"Alice Smith\" is allocated 100% to project \"E-Commerce Mobile Portal\"\n    When \"Alice Smith\" applies for leave from \"2026-09-01\" to \"2026-09-05\" in \"Leave Tracker\"\n    Then the policy engine should evaluate capacity constraints across all active projects\n    And if approved, the system should prevent logging worklog hours on those approved leave dates\n    And update the visual balance rail for \"Annual Paid Leaves Quota\"\n\n  Scenario: Configure Global Leave Settings and Quotas\n    Given an Administrator opens the \"Leave Settings\" page\n    When the Admin sets \"Annual Paid Leaves Quota\" to 18 days\n    And the Admin toggles \"Allow Carry-Over Leaves\" to enabled\n    And sets \"Carry-Over Days Limit\" to 5\n    And saves the settings\n    Then the global leave quota should apply to all new and existing resources\n    And the Resource Leave Accounts table should display individual staff leave balances:\n      | Column Header       |\n      | Staff Name          |\n      | Role                |\n      | Carry-Over Balance  |\n      | Current Balance     |\n      | Remaining Days      |\n\n  Scenario: Quality KPI Plan Consumed Progress Rail Visibility\n    Given the Delivery Manager views the \"Quality & Estimations\" auditing panel\n    Then the KPI summary card should include a \"Plan Consumed\" progress rail\n    And the rail should visually represent the percentage of planned effort already consumed against the total planned estimation\n","uri":"features\\03_portfolio_management.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Portfolio and Enterprise Resource Management","description":"  As a PM, Delivery Manager, or Executive\n  I want to oversee portfolios, monitor executive health metrics, audit quality/estimations, track billing, manage resources, and administer leaves\n  So that enterprise projects are delivered on budget with high quality and balanced utilization","children":[{"scenario":{"id":"bfcca4d0-54f3-484b-b359-0ca1f01d841f","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"My Projects PM View — Initial Estimations Requiring Validation","description":"","steps":[{"id":"e5fb38ac-3b0a-47b2-88a9-dc168c5e2110","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"a Project Manager \"Sarah Connor\" is logged in to ProjectFlow"},{"id":"ebff0989-a9ed-4a06-80ae-1b2c06ae9810","location":{"line":8,"column":5},"keyword":"When ","keywordType":"Action","text":"the PM navigates to \"My Projects\""},{"id":"719a3603-d721-4584-8fb7-ae3c75fafe06","location":{"line":9,"column":5},"keyword":"Then days","type":"Action","astNodeIds":["817e65d6-92d2-4589-8164-de1e514b154f"]},{"id":"6c801026-b6d2-4570-9fc1-3c0718902f8f","text":"the Admin toggles \"Allow Carry-Over Leaves\" to enabled","type":"Action","astNodeIds":["cff6a3b6-a505-4821-bb1d-0f17021ac501"]},{"id":"97eec548-ce17-45a0-9894-191e75dd1258","text":"sets \"Carry-Over Days Limit\" to 5","type":"Action","astNodeIds":["61e36442-c96b-435f-9deb-7b1bc184c581"]},{"id":"77670816-3307-48e7-b931-f417ecb65b01","text":"saves the settings","type":"Action","astNodeIds":["cee1dd08-6274-49e0-9ef5-471b077f0af3"]},{"id":"b475b99a-9575-4980-a3e8-8425342cf148","text":"the global leave quota should apply to all new and existing resources","type":"Outcome","astNodeIds":["0a0e8eef-d5bf-4236-b64c-2de830f7a294"]},{"id":"3612980c-68c6-47c0-b2cb-c79373d8e8ae","text":"the Resource Leave Accounts table should display individual staff leave balances:","type":"Outcome","argument":{"dataTable":{"rows":[{"cells":[{"value":"Column Header"}]},{"cells":[{"value":"Staff Name"}]},{"cells":[{"value":"Role"}]},{"cells":[{"value":"Carry-Over Balance"}]},{"cells":[{"value":"Current Balance"}]},{"cells":[{"value":"Remaining Days"}]}]}},"astNodeIds":["a63c21dd-833b-4f2e-a354-2ba72654cd66"]}]}},{"pickle":{"id":"a0e5408b-4e7d-4e88-9371-879af083acec","uri":"features\\03_portfolio_management.feature","location":{"line":121,"column":3},"astNodeIds":["86f2bf18-5998-44bd-81bb-a94010310a16"],"tags":[],"name":"Quality KPI Plan Consumed Progress Rail Visibility","language":"en","steps":[{"id":"7da15490-1ac1-4d7f-a717-093458111bad","text":"the Delivery Manager views the \"Quality & Estimations\" auditing panel","type":"Context","astNodeIds":["99a7d4b6-982d-41e2-92c9-48ce795ff91d"]},{"id":"7498ab7f-4dbb-4ef1-a1e0-6dde46a82f4a","text":"the KPI summary card should include a \"Plan Consumed\" progress rail","type":"Outcome","astNodeIds":["b99e4b1b-8b3f-4501-ab98-4a2aeb3ace1c"]},{"id":"8fadd631-e66f-4849-8006-cdd7ed10e67d","text":"the rail should visually represent the percentage of planned effort already consumed against the total planned estimation","type":"Outcome","astNodeIds":["16986898-d128-4974-8cdd-cc8ed6f63ef9"]}]}},{"source":{"data":"Feature: Initial Estimation and AI-Assisted Project Scoping\n  As a Project Manager or Solution Architect\n  I want to initialize scoping, leverage AI for stack and horizontal staffing recommendations, and generate baseline estimations\n  So that project feasibility, impacted systems, staffing, and budget estimates are established accurately\n\n  Background:\n    Given the PM has created a new project \"Cloud Payment Gateway Integration\"\n    And set the project status dropdown to \"Initial Estimation\"\n    And entered the Project Summary scope text:\n      \"\"\"\n      Build a scalable multi-tenant payment gateway integration supporting credit cards, PayPal, and Apple Pay with automated recurring billing, webhooks, and fraud detection.\n      \"\"\"\n\n  Scenario Outline: Generate AI Architecture Stack Suggestions and Ingest Impacted Systems\n    Given the user is on the Initial Estimation workspace for \"Cloud Payment Gateway Integration\"\n    When the user clicks the \"Stack Suggest\" button\n    Then the generative LLM engine analyzes the Project Summary scope text\n    And presents 3 tailored architectural options:\n      | Option | Architecture Suite | Key Technologies |\n      | 1      | Next.js Full-Stack | Vercel, MongoDB, NextAuth, Stripe |\n      | 2      | AWS Serverless     | Amplify, Lambda, DynamoDB, Cognito |\n      | 3      | Microservices Suite| Kubernetes, PostgreSQL, Keycloak, Kafka |\n    When the user selects \"\x3Cselected_option>\"\n    Then those technical zones should be automatically ingested as structured lines under \"Impacted Systems\"\n    When the user clicks \"Add System\" and manually enters \"\x3Cmanual_system>\"\n    Then \"\x3Cmanual_system>\" should be appended to the Impacted Systems list\n\n    Examples:\n      | selected_option    | manual_system                  |\n      | Next.js Full-Stack | Legacy Billing ERP Connector   |\n      | AWS Serverless     | External Fraud Scoring Service |\n\n  Scenario: Generate Horizontal Staffing Composition and Billing Rates\n    Given the Impacted Systems list is configured for \"Cloud Payment Gateway Integration\"\n    When the user clicks the \"Horizontal Suggest\" button\n    Then the AI engine should output proportional staffing compositions across core practices:\n      | Practice Role          | Suggested Allocation |\n      | Project Management     | 15%                  |\n      | Business Analysis      | 15%                  |\n      | Solution Architecture  | 10%                  |\n      | Full-Stack Development | 40%                  |\n      | Quality Assurance      | 15%                  |\n      | DevOps & Infrastructure| 5%                   |\n    When the user assigns operational daily billing rates for each role\n    Then the baseline horizontal rate structure should be calculated and stored\n\n  Scenario: AI Effort Compilation and Estimation Confirmation\n    Given the project scope, impacted systems, and horizontal staffing rates are established\n    When the user clicks the \"AI Estimator\" utility button\n    Then the AI model cross-references the scope matrix against global execution averages\n    And outputs baseline effort allocations in Man-Days\n    When the Project Manager fine-tunes effort adjustments\n    And clicks \"Confirm Estimation\"\n    Then the estimation lock should be applied\n    And the project status should transition out of initialization into active status\n","uri":"features\\04_initial_estimation.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Initial Estimation and AI-Assisted Project Scoping","description":"  As a Project Manager or Solution Architect\n  I want to initialize scoping, leverage A 8eac-09833cd7f22e","text":"the project scope, impacted systems, and horizontal staffing rates are established","type":"Context","astNodeIds":["28a7373f-a24f-4cb5-8963-1b5275367bfc"]},{"id":"bda2db94-8497-48f2-aa9a-0348a3b5189a","text":"the user clicks the \"AI Estimator\" utility button","type":"Action","astNodeIds":["ee2c0c51-9020-49f6-9ea7-a03bf462bfcf"]},{"id":"3dd13d7f-8939-4a91-a2d9-9a4af1c044f1","text":"the AI model cross-references the scope matrix against global execution averages","type":"Outcome","astNodeIds":["a0de3d5d-8cd9-4471-a1be-b7167a9ac4d6"]},{"id":"246189b2-75b6-453f-9afd-a81d2bb6c8df","text":"outputs baseline effort allocations in Man-Days","type":"Outcome","astNodeIds":["6bf60de6-ad8e-4159-b535-2d57815b79a3"]},{"id":"8cb14abe-8291-49b3-80c3-25bad08caa2f","text":"the Project Manager fine-tunes effort adjustments","type":"Action","astNodeIds":["c4196030-963a-4597-a54d-13792bd28d0e"]},{"id":"1324b0aa-8ed9-4c19-be7f-43ab866e91e0","text":"clicks \"Confirm Estimation\"","type":"Action","astNodeIds":["7ad88330-3e96-4054-9d99-0bc1fa15d14b"]},{"id":"41819e7e-699f-4614-8dac-207e907d9aeb","text":"the estimation lock should be applied","type":"Outcome","astNodeIds":["493c1069-b71b-43c7-a1f3-53575011d027"]},{"id":"39813cb8-b676-4d28-bd27-7c389d4ebc8f","text":"the project status should transition out of initialization into active status","type":"Outcome","astNodeIds":["242716b9-ae1e-41ed-9acf-0ffafb5fede2"]}]}},{"source":{"data":"Feature: Project Lifecycle Execution and Operations\n  As a Project Manager, Tech Lead, Developer, QA Engineer, or PMO Auditor\n  I want to manage execution details, backlog items, testing cycles, RAID governance, and financial invoicing\n  So that software delivery remains transparent, high quality, and contractually compliant\n\n  Background:\n    Given an active project \"E-Commerce Mobile Portal\" exists in the system\n\n  Scenario: Manage Project Details and Interactive Health Sliders\n    Given the PM opens the \"Project Details & Status\" page\n    When the PM adjusts the Project Health Grid sliders:\n      | Axis  | Indicator State |\n      | Scope | Green           |\n      | Cost  | Yellow          |\n      | Time  | Green           |\n    And saves changes\n    Then the overall operational color indicator for \"E-Commerce Mobile Portal\" should be updated accordingly\n\n  Scenario: Manage Active Milestones in Project Details\n    Given the PM is on the \"Project Details & Status\" page for \"E-Commerce Mobile Portal\"\n    When the PM adds a milestone \"MVP Launch\" with target date \"2026-11-01\"\n    And adds a second milestone \"Full Product Launch\" with target date \"2027-01-15\"\n    Then both milestones should appear in the Active Milestones section of the project details\n\n  Scenario: PM Dashboard Execution Metrics Oversight\n    Given the Delivery Director views the \"PM Dashboard\"\n    Then the radial charts should display percentage completion against release targets\n    And the time analytics should calculate planned vs logged worklog hours\n    And the workload quality vector should flag high bug-to-delivery hour ratios\n    And the swimlane residence chart should display average residence time across states:\n      | Swimlane State |\n      | To Do          |\n      | In Progress    |\n      | In QA          |\n      | Done           |\n    And the \"Time by Resource\" section should display average unit execution timelines mapped across individual team members\n\n  Scenario: Epic Tracking Arrays in PM Dashboard\n    Given the Delivery Director views the \"PM Dashboard\" for \"E-Commerce Mobile Portal\"\n    Then the Epic Tracking section should display high-level component epics as linear progress arrays\n    And each epic row should show its name and percentage completion\n\n  Scenario: Configure Infrastructure Environments Matrix\n    Given the Lead Architect opens \"Specifications & Environments\"\n    When the user adds infrastructure environment layers:\n      | Layer Name                   | Tier Code |\n      | System Integration Testing   | SIT       |\n      | User Acceptance Testing      | UAT       |\n      | Production                   | PROD      |\n    Then the pipeline environment matrix should reflect SIT, UAT, and PROD layers\n\n  Scenario: Environment Ordering and Deletion in Specifications\n    Given the Lead Architect is on the \"Specifications & Environments\" page for \"E-Commerce Mobile Portal\"\n    When the Lead Architect reorders the environment layers placing \"UAT\" above \"SIT\"\n    Then the environment list should reflect the new order\n    When the Lead Architect deletes the \"UAT\" environment layer\n    Then the \"UAT\" layer should be removed from the pipeline environment matrix\n\n  Scenario: Resource Onboarding and Capability Integrity Check\n    Given a Tech Lead assigns a user to \"E-Commerce Mobile Portal\"\n    When the user capability does not match the project \"Impacted Systems\"\n    Then the system should trigger a capability mapping error\n    And Unless \"Full-Stack Development\" is configured as a generic target capability\n\n  Scenario: Capacity Planning Ledger Sprint, Month and Week Views\n    Given a PM opens \"Project Resources & Capacity Planning\" for \"E-Commerce Mobile Portal\"\n    Then the capacity planning ledger should be visible with impacted software systems breakdown\n    When the PM switches the view toggle to \"Sprint\"\n    Then capacity should be displayed for the current sprint window\n    When the PM switches the view toggle to \"Month\"\n    Then capacity should be displayed for the current calendar month\n    When the PM switches the view toggle to \"Week\"\n    Then capacity should be displayed for the current week\n    And the user should be able to toggle between \"Days\" and \"Hours\" measurement units\n\n  Scenario: Daily Worklog Hour Logging\n    Given a Developer \"Alice Smith\" opens the \"Worklog\" interface\n    When \"Alice Smith\" selects date \"2026-08-10\"\n    And logs 6 hours against Story \"ST-101: User Login UI\"\n    And logs 2 hours against \"Other\" with mandatory text \"Team Sync and Code Review\"\n    And submits the worklog entry\n    Then 8 total worklog hours should be recorded for \"Alice Smith\" on \"2026-08-10\"\n\n  Scenario: Resource Workload Calendar Health Monitor\n    Given a PM opens the \"Resource Workload\" view for \"E-Commerce Mobile Portal\"\n    Then the calendar grid should render for all staffed project engineers\n    And healthy capacity blocks should appear in green for resources within normal allocation\n    And over-allocated resources should be visually flagged with a warning indicator\n\n  Scenario: Gantt Release Timeline and Milestone Freezes\n    Given the PM views \"Releases, Stages & Milestones\"\n    Then the Gantt chart timeline should render macro phases: Design, Development, Testing\n    And display rigid milestone markers for \"Design Freeze\" and \"Code Freeze\"\n\n  Scenario: Release Burnup Chart on Development Dashboard\n    Given the PM opens the \"Development Dashboard\" for \"E-Commerce Mobile Portal\"\n    Then the Sprint Burndown chart should display active sprint velocity\n    And the cumulative Release Burnup chart should display overall release progress\n    And both charts should update as worklogs and story completions are recorded\n\n  Scenario: Story Point Monetization Bridge and Backlog Elaboration\n    Given a Product Owner creates User Story \"ST-202: Payment Gateway Integration\"\n    And the Tech Lead assigns 8 Story Points to \"ST-202\"\n    When the PM executes the \"Story Point Monetization Bridge\" conversion\n    Then the system should calculate the equivalent contract billing hours based on historical point velocity\n\n  Scenario: Product Backlog Item Type Variety\n    Given a BA opens the \"Product Backlog\" for \"E-Commerce Mobile Portal\"\n    When the BA creates backlog items of each supported type:\n      | Item Type        |\n      | Requirement/Story|\n      | Feature Change   |\n      | Task             |\n      | Bug              |\n    Then all four item types should appear in the product backlog list with correct type labels\n\n  Scenario: Full User Story Elaboration Flow\n    Given BA \"Jane Doe\" creates User Story \"ST-301: User Profile Management\" in the backlog\n    When Tech Lead \"Bob\" reviews the story and maps impacted components:\n      | Component          |\n      | Profile Service API|\n      | Auth Gateway       |\n    Then the story should display the impacted component dependency list\n    When Developer \"Alice Smith\" adds sub-tasks under \"ST-301\":\n      | Sub-task Title                  | Estimate (Hours) |\n      | Implement profile update API    | 8                |\n      | Write unit tests for API        | 4                |\n      | Integrate with Auth Gateway     | 6                |\n    Then the cumulative sub-task effort should form the size metric of \"ST-301\"\n    And the story total should show 18 hours\n\n  Scenario: Bulk Sub-Task Matrix High Velocity Scheduling\n    Given a Tech Lead opens the \"Bulk Sub-Tasks Matrix\" for \"E-Commerce Mobile Portal\"\n    Then a tabular workspace should display all atomic sub-tasks across the project\n    When the Tech Lead selects multiple sub-tasks and assigns them to \"Alice Smith\"\n    Then all selected sub-tasks should be routed to \"Alice Smith\" in bulk\n    When the Tech Lead reschedules a batch of sub-tasks to \"Sprint 4\"\n    Then all selected sub-tasks should show \"Sprint 4\" as their target sprint\n\n  Scenario: Grooming Board Capacity Validation and Bulk Sub-Task Matrix\n    Given the Tech Lead opens the \"Grooming Board\"\n    When dragging User Story \"ST-202\" into \"Sprint 3\" cycle column\n    Then the system checks real-time sprint capacity boundaries in the top header\n    And if sub-task conditions are satisfied, marks the item with a green validation tick\n\n  Scenario: Kanban Board Story vs Sub-Task Filtering and Engineer Sorting\n    Given the Kanban board is open for \"E-Commerce Mobile Portal\"\n    When the user applies the \"User Stories\" filter\n    Then the Kanban should show only high-level user story cards\n    When the user switches to the \"Sub-Tasks\" filter\n    Then the Kanban should show only atomic sub-task cards\n    When the user sorts the Kanban by engineer \"Alice Smith\"\n    Then only tasks assigned to \"Alice Smith\" should be displayed on the board\n\n  Scenario: Test Backlog Plan Execution and Coverage Score\n    Given a QA Lead opens the \"Testing Dashboard\"\n    Then the dashboard should calculate the \"Story Test Coverage Metric %\"\n    When compiling an \"SIT Execution Plan\", the QA Lead selects test cases from the backlog\n    And assigns execution dates\n    Then the test plan should be saved and active for SIT execution\n\n  Scenario: Testing Dashboard Charts - Bugs by Status, Velocity Trend and Leakage\n    Given a QA Lead opens the \"Testing Dashboard\" for \"E-Commerce Mobile Portal\"\n    Then the dashboard should display a pie chart for \"Bugs by Status\"\n    And the dashboard should display a pie chart for \"Open Bugs by Severity\" with segments:\n      | Severity |\n      | Low      |\n      | Medium   |\n      | High     |\n      | Critical |\n    And the \"Daily Testing Velocity Trend\" chart should show cumulative test runs, closures, and bug identification lines\n    And the \"Test Leakage Bar Charts\" should visualize defect distribution across SIT, UAT, and Prod by severity\n\n  Scenario: Log New Defect and Embed Story Context\n    Given a QA Tester opens \"Defect Tracker\"\n    When the tester clicks \"Add New Defect\" and fills:\n      | Field                 | Value                                     |\n      | Title                 | Token Timeout on Checkout                 |\n      | Severity              | High                                      |\n      | Target Sprint         | Sprint 3                                  |\n      | Related Story ID      | ST-202                                    |\n      | Found In Test Plan    | SIT Execution Plan 1                      |\n    And submits the defect form\n    Then the defect card should automatically embed into developer story \"ST-202\" context\n    And appear in the \"In Triage\" column of the Defect Kanban Board\n\n  Scenario: Defect Kanban Column State Transitions\n    Given a defect \"Token Timeout on Checkout\" exists in the Defect Kanban board\n    When the QA Lead drags the defect from \"In Triage\" to \"Defect Backlog\"\n    Then the defect should appear in the \"Defect Backlog\" column\n    When a developer picks it up and moves it to \"In Progress\"\n    Then the defect should appear in the \"In Progress\" column\n    When the developer resolves it and moves it to \"Retest\"\n    Then the defect should appear in the \"Retest\" column\n    When the QA verifies the fix and moves it to \"Closed\"\n    Then the defect should appear in the \"Closed\" column\n\n  Scenario: RAID Log Governance and AI Generator Modules\n    Given the Risk Manager accesses the \"RAID Dashboard\"\n    When the Risk Manager clicks \"AI Risk Gen\"\n    Then the AI engine should analyze project parameters and suggest common domain risks\n    When the user clicks \"AI Gen Assumptions\" and \"AI Gen Dependencies\"\n    Then project assumptions and third-party dependencies should be suggested and logged\n\n  Scenario: RAID Risk Severity and Probability Computation\n    Given the Risk Manager is on the \"Risks Ledger\" in the RAID dashboard\n    When the Risk Manager logs a new risk with Severity \"High\" and Probability \"Medium\"\n    Then the system should compute and display an active risk level flag for the risk\n    And the risk should appear in the Risks Ledger table with correct severity, probability, and computed risk level\n\n  Scenario: RAID Project Issues Portal Workflow\n    Given the Delivery Manager opens the \"Project Issues Portal\" in the RAID dashboard\n    When the Manager logs a new issue \"Client has not provided UAT credentials\"\n    And categorizes it as an operational block\n    Then the issue should appear in the Issues table\n    And it should be distinguishable from engineering bugs logged in the Defect Tracker\n\n  Scenario: PMO Phase Gate Validation for Initialization and Production\n    Given a PMO Auditor reviews project documents in \"PMO & Project Documents\"\n    When the project attempts to initialize without a verified \"Statement of Work (SOW)\" URL link\n    Then initialization should be blocked by the phase gate\n    When attempting a Production Deployment release without QA lead sign-off validation\n    Then the phase gate should prevent release authorization\n\n  Scenario: PMO External Document URL Registration\n    Given a PMO Auditor is on the \"PMO & Project Documents\" page\n    When the auditor registers an external document URL for \"Statement of Work (SOW)\" pointing to \"https://drive.company.com/sow-ecomm.pdf\"\n    Then the SOW entry should appear in the document repository with the registered URL\n    And the SOW phase gate status should update to \"Verified\"\n\n  Scenario Outline: Financial Invoicing Ledger Processing\n    Given a project configured with pricing model \"\x3Cpricing_model>\"\n    When the monthly financial calculation engine runs for \"\x3Cpricing_model>\"\n    Then the invoice ledger should calculate \"\x3Ccalculation_rule>\"\n\n    Examples:\n      | pricing_model     | calculation_rule                                                       |\n      | Fixed Bid         | Fixed budget vs billed/cost rates per day and deliverable milestones   |\n      | Time & Material  | Billed hours scanned against LOP absences and Overtime worklog entries |\n\n  Scenario: Fixed Bid Fixed Costs Module and System Invoicing Table\n    Given the Finance Manager opens the \"Fixed Bid Billing & Invoicing Ledger\" for \"E-Commerce Mobile Portal\"\n    When the Finance Manager adds fixed cost line items:\n      | Description                  | Amount (USD) |\n      | GitHub Repository Fee        | 200          |\n      | Third-Party Server Hosting   | 800          |\n      | Architectural Setup Fee      | 1500         |\n    Then the Fixed Costs Module should list all three line items\n    And the System Invoicing Table should combine active resource tallies with fixed cost line items\n    And output the absolute project contract value\n\n  Scenario: Fixed Bid Payment Milestone State Transitions\n    Given the Finance Manager is on the \"FB Payment Milestones Dashboard\" for \"E-Commerce Mobile Portal\"\n    When the milestone \"Alpha Delivery\" is moved to state \"Milestone Completed\"\n    Then the state change date should be logged\n    When the milestone is advanced to \"Invoice Raised\"\n    Then the Invoice Raised date should be recorded\n    When the milestone is marked as \"Payment Completed\"\n    Then the full state history log should show all transitions with their dates:\n      | State                | Date       |\n      | In Progress          | 2026-08-01 |\n      | Milestone Completed  | 2026-09-15 |\n      | Invoice Raised       | 2026-09-20 |\n      | Payment Completed    | 2026-10-05 |\n\n  Scenario: TnM Monthly Billing Period Timeline Terminal\n    Given the Finance Manager views the \"TnM Billing Ledger\" for a Time & Material project\n    Then the TnM Payment Milestones Terminal should display chronological monthly billing periods\n    And each period frame should show invoice generation parameters (billing period dates, hours billed, LOP deductions, overtime additions)\n    And the monthly invoice summary should be calculable from the period data\n\n  Scenario: BCP Code Repository Access Token Validity Tracking\n    Given the Delivery Manager is on the \"BCP Profile\" for \"E-Commerce Mobile Portal\"\n    When the Manager registers a code repository entry:\n      | Field                    | Value                       |\n      | Repository URL           | https://github.com/org/repo |\n      | Access Token Expiry Date | 2026-12-31                  |\n    Then the repository entry should appear in the \"Code Repository Logs\" section\n    And the system should display the access token validity frame with expiry date \"2026-12-31\"\n\n  Scenario: Business Continuity Profile (BCP) and Backup Contact Assignment\n    Given the Delivery Manager checks the \"BCP Profile\"\n    Then infrastructure endpoints, SSL cert expiry dates, and repository token validity frames should be tracked\n    When a primary developer is flagged as departing\n    Then mapped backup contact details (Name, Role, Email, Phone) should immediately display for delivery continuity\n","uri":"features\\05_project_execution.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Project Lifecycle Execution and Operations","description":"  As a Project Manager, Tech Lead, Developer, QA Engineer, or PMO Auditor\n  I want to manage execution details, backlog items, testing cycles, RAID governance, and financial invoicing\n  So that software delivery remains transparent, high quality, and contractually compliant","children":[{"background":{"id":"c0ef32d2-664a-4c6f-a68a-a202cb1aca90","location":{"line":6,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"1cfd8c38-4bd3-4666-8e05-367be28fb85d","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an active project \"E-Commerce Mobile Portal\" exists in the system"}]}},{"scenario":{"id":"fc4a861b-50df-4fa8-b9a4-1a240a3d6617","tags":[],"location":{"line":9,"column":3},"keyword":"Scenario","name":"Manage Project Details and Interactive Health Sliders","description":"","steps":[{"id":"674b9fc5-8252-45f6-b501-6649c75afa43","location":{"line":10,"column":5},"ke
